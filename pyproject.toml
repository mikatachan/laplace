[project]
name = "laplace-pool"
version = "0.1.0"
description = "Priority-aware admission control + idle/external-tenant model reaping for a shared local LLM inference pool (LM Studio, Ollama, ...)."
authors = [{ name = "mikatachan" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # stdlib-only core; adapters bring their own (e.g. lms CLI)

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
serve = ["aiohttp>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution name is `laplace-pool` but the import packages are `laplace` and
# `laplace_serve`, so hatchling can't auto-discover them, declare them here.
packages = ["laplace", "laplace_serve"]
